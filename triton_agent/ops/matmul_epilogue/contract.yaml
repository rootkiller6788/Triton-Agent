op: matmul_epilogue

inputs:
  a: [B, M, K]
  b: [K, N]
  bias: [N]

outputs:
  c: [B, M, N]

dtype:
  - fp16
  - bf16

device:
  - cuda

tolerance:
  max_abs_error: 1e-2
  mean_abs_error: 1e-3

search_space:
  BLOCK_M: [64, 128, 256]
  BLOCK_N: [64, 128, 256]
  BLOCK_K: [32, 64, 128]
  num_warps: [4, 8]
  num_stages: [2, 3, 4]

benchmark:
  warmup: 20
  repeat: 100
  metric: latency_us_p50

promotion:
  min_speedup: 1.05
  max_variance: 0.10
  regression_required: true
