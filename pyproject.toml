[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-agent"
version = "0.1.0"
description = "A lightweight operator self-optimization agent for low-cost, high-quality Triton kernel development."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "numpy>=1.24",
    "rich>=13.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
    "triton>=2.1; platform_system == 'Linux'",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pre-commit>=3.0",
]

[project.scripts]
triton-agent = "triton_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
